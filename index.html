<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI 性格测评</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#4A90D9;
  --primary-light:#E8F1FA;
  --primary-dark:#3A7BC8;
  --text:#2C3E50;
  --text-light:#7F8C8D;
  --text-lighter:#BDC3C7;
  --bg:#FFFFFF;
  --bg-soft:#F8F9FA;
  --border:#E8ECF0;
  --radius:12px;
  --shadow-lg:0 4px 24px rgba(0,0,0,0.1);
  --shadow:0 2px 12px rgba(0,0,0,0.06);
}
html,body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg-soft);
  color:var(--text);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.app{
  width:100%;max-width:580px;background:var(--bg);border-radius:20px;
  box-shadow:var(--shadow-lg);overflow:hidden;min-height:560px;
  display:flex;flex-direction:column;position:relative;
}

/* ===== Welcome ===== */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 32px;flex:1;text-align:center}
.welcome-icon{width:72px;height:72px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;margin-bottom:24px}
.welcome-icon svg{width:36px;height:36px}
.welcome h1{font-size:28px;font-weight:700;margin-bottom:12px;letter-spacing:1px}
.welcome .sub{font-size:15px;color:var(--text-light);margin-bottom:8px}
.welcome .desc{font-size:14px;color:var(--text-lighter);margin-bottom:32px;line-height:1.8}
.btn-primary{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:14px 48px;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;min-height:44px;font-family:inherit}
.btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-secondary{background:var(--bg);color:var(--primary);border:1.5px solid var(--primary);border-radius:10px;padding:12px 36px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;min-height:44px;font-family:inherit}
.btn-secondary:hover{background:var(--primary-light)}
.disclaimer{font-size:12px;color:var(--text-lighter);margin-top:32px;max-width:340px;line-height:1.6}

/* ===== Quiz ===== */
.quiz{display:none;flex-direction:column;flex:1;padding:32px 28px 20px}
.quiz-header{margin-bottom:24px}
.progress-info{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text-light);margin-bottom:10px}
.progress-bar{width:100%;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--primary);border-radius:3px;transition:width .3s ease;width:0%}
.q-text{font-size:20px;font-weight:600;text-align:center;margin:28px 0 24px;line-height:1.5}
.options{display:flex;flex-direction:column;gap:14px;flex:1}
.option-btn{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius);padding:18px 20px;font-size:15px;color:var(--text);cursor:pointer;transition:all .2s;text-align:left;line-height:1.5;font-family:inherit;display:flex;align-items:center;gap:12px;min-height:44px}
.option-btn:hover{border-color:var(--primary);background:var(--primary-light)}
.option-btn.selected{border-color:var(--primary);background:var(--primary-light);color:var(--primary-dark);font-weight:600}
.option-label{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;transition:all .2s}
.option-btn:hover .option-label{border-color:var(--primary);color:var(--primary)}
.option-btn.selected .option-label{border-color:var(--primary);background:var(--primary);color:#fff}
.nav-buttons{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
.nav-btn{background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:10px 24px;font-size:14px;color:var(--text-light);cursor:pointer;transition:all .2s;font-family:inherit;min-height:40px}
.nav-btn:hover{border-color:var(--primary);color:var(--primary)}
.nav-btn:disabled{opacity:.4;cursor:not-allowed}
.nav-btn.next{background:var(--primary);color:#fff;border-color:var(--primary)}
.nav-btn.next:hover{background:var(--primary-dark)}
.nav-btn.next:disabled{background:var(--border);border-color:var(--border);color:var(--text-lighter)}

/* ===== Result ===== */
.result{display:none;flex-direction:column;align-items:center;padding:40px 28px 28px;flex:1}
.result-type{font-size:48px;font-weight:800;color:var(--primary);letter-spacing:4px;margin-bottom:4px}
.result-nickname{font-size:18px;font-weight:600;color:var(--text);margin-bottom:8px}
.result-traits{font-size:14px;color:var(--text-light);text-align:center;margin-bottom:28px;line-height:1.6;max-width:380px}
.dim-chart{width:100%;margin-bottom:28px}
.dim-row{margin-bottom:18px}
.dim-labels{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px}
.dim-labels .l{color:var(--text)}
.dim-labels .r{color:var(--text-light)}
.dim-bar{display:flex;height:24px;border-radius:6px;overflow:hidden;background:var(--border)}
.bar-l,.bar-r{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;transition:width .6s ease}
.bar-l{background:var(--primary)}
.bar-r{background:var(--text-lighter)}
.bar-l.sec{background:var(--text-lighter);color:var(--text-light)}
.bar-r.sec{background:var(--primary);color:#fff}
.dim-letters{width:100%;margin-bottom:24px}
.dim-letter-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.dim-letter-row:last-child{border-bottom:none}
.dim-letter-badge{width:36px;height:36px;border-radius:8px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0}
.dim-letter-text{font-size:14px;color:var(--text)}
.dim-letter-text strong{font-weight:600}
.result-actions{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;justify-content:center}
.footer{text-align:center;padding:16px;font-size:12px;color:var(--text-lighter);border-top:1px solid var(--border);line-height:1.5}

/* ===== Responsive ===== */
@media(max-width:768px){body{padding:0;background:var(--bg)}.app{border-radius:0;min-height:100vh;box-shadow:none}}
@media(max-width:380px){.welcome{padding:36px 20px}.welcome h1{font-size:24px}.quiz{padding:24px 18px}.q-text{font-size:18px}.result-type{font-size:40px}.option-btn{padding:16px 16px;font-size:14px}}

/* ===== Animations ===== */
.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.slide-in{animation:slideIn .25s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* ===== Unanswered Modal ===== */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal-box{background:var(--bg);border-radius:16px;padding:32px 28px;max-width:340px;width:90%;text-align:center;box-shadow:var(--shadow-lg)}
.modal-box h3{font-size:18px;font-weight:700;margin-bottom:12px}
.modal-box p{font-size:14px;color:var(--text-light);margin-bottom:20px;line-height:1.6}
.modal-box .modal-actions{display:flex;gap:12px;justify-content:center}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- Welcome -->
  <div class="welcome" id="welcomePage">
    <div class="welcome-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#4A90D9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
        <line x1="9" y1="9" x2="9.01" y2="9"/>
        <line x1="15" y1="9" x2="15.01" y2="9"/>
      </svg>
    </div>
    <h1>MBTI 性格测评</h1>
    <div class="sub">20 道题，2 分钟了解你的性格类型</div>
    <div class="desc">通过 E/I、S/N、T/F、J/P 四个维度<br>快速测出你的 MBTI 人格类型与倾向比例</div>
    <button class="btn-primary" onclick="startQuiz()">开始测评</button>
    <div class="disclaimer">本测评仅供娱乐和自我了解，不构成心理诊断或专业建议。</div>
  </div>

  <!-- Quiz -->
  <div class="quiz" id="quizPage">
    <div class="quiz-header">
      <div class="progress-info">
        <span id="qCounter">第 1/20 题</span>
        <span id="qPct">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="q-text" id="qText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="nav-buttons">
      <button class="nav-btn" id="prevBtn" onclick="goPrev()">上一题</button>
      <button class="nav-btn next" id="nextBtn" onclick="goNext()">下一题</button>
    </div>
  </div>

  <!-- Result -->
  <div class="result" id="resultPage">
    <div class="result-type" id="resultType"></div>
    <div class="result-nickname" id="resultNickname"></div>
    <div class="result-traits" id="resultTraits"></div>
    <div class="dim-chart" id="dimChart"></div>
    <div class="dim-letters" id="dimLetters"></div>
    <div class="result-actions">
      <button class="btn-primary" onclick="exportResult()">保存结果图片</button>
      <button class="btn-secondary" onclick="restart()">重新测试</button>
    </div>
    <div class="disclaimer">本测评仅供娱乐和自我了解，不构成心理诊断或专业建议。如需专业心理评估，请咨询合格的心理咨询师。</div>
  </div>

  <div class="footer">MBTI 性格测评 · 仅供参考娱乐</div>
</div>

<!-- Unanswered Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3>还有未作答的题目</h3>
    <p id="modalText">您有 3 道题尚未作答，请完成所有题目后再查看结果。</p>
    <div class="modal-actions">
      <button class="btn-primary" onclick="closeModal()">去作答</button>
    </div>
  </div>
</div>

<script>
// ===== 16 Type Data =====
var TYPE_DATA = {
  INTJ:{n:"建筑师",t:"富有想象力又果断的战略家，一切都在计划之中。"},
  INTP:{n:"逻辑学家",t:"具有创造力的发明家，对知识有不可抑制的渴望。"},
  ENTJ:{n:"指挥官",t:"大胆且果断的领导者，总能找到或开辟出一条路。"},
  ENTP:{n:"辩论家",t:"聪明好奇的思想者，无法抗拒智力上的挑战。"},
  INFJ:{n:"提倡者",t:"安静而神秘，同时鼓舞人心且不知疲倦的理想主义者。"},
  INFP:{n:"调停者",t:"诗意、善良的利他主义者，总是热情地为正义事业伸出援手。"},
  ENFJ:{n:"主人公",t:"富有魅力、鼓舞人心的领导者，能让听众如痴如醉。"},
  ENFP:{n:"竞选者",t:"热情、有创造力、爱社交的自由灵魂，总能找到微笑的理由。"},
  ISTJ:{n:"物流师",t:"务实且注重事实的人，可靠性不容怀疑。"},
  ISFJ:{n:"守护者",t:"非常专注而温暖的守护者，时刻准备保护爱的人。"},
  ESTJ:{n:"总经理",t:"出色的管理者，在管理事务或人员方面无与伦比。"},
  ESFJ:{n:"执政官",t:"极有同情心、爱社交、受欢迎的人，总是乐于助人。"},
  ISTP:{n:"鉴赏家",t:"大胆而实际的实验家，擅长各种工具的运用。"},
  ISFP:{n:"探险家",t:"灵活有魅力的艺术家，时刻准备探索和体验新事物。"},
  ESTP:{n:"企业家",t:"聪明、精力充沛的感知者，真正享受生活在边缘的感觉。"},
  ESFP:{n:"表演者",t:"自发的、精力充沛而热情的表演者，生活在他们周围永不无聊。"}
};

// ===== Dimension Labels =====
var DIM_INFO = {
  EI:{l:"E",lLabel:"外向 (E)",r:"I",rLabel:"内向 (I)"},
  SN:{l:"S",lLabel:"实感 (S)",r:"N",rLabel:"直觉 (N)"},
  TF:{l:"T",lLabel:"思考 (T)",r:"F",rLabel:"情感 (F)"},
  JP:{l:"J",lLabel:"判断 (J)",r:"P",rLabel:"感知 (P)"}
};

var DIM_LETTER_INFO = {
  E:{name:"外向 Extraversion",desc:"能量来自外部社交和互动"},
  I:{name:"内向 Introversion",desc:"能量来自内心世界和独处"},
  S:{name:"实感 Sensing",desc:"关注具体事实和细节"},
  N:{name:"直觉 Intuition",desc:"关注抽象概念和可能性"},
  T:{name:"思考 Thinking",desc:"决策基于逻辑和分析"},
  F:{name:"情感 Feeling",desc:"决策基于情感和价值观"},
  J:{name:"判断 Judging",desc:"偏好计划性和秩序"},
  P:{name:"感知 Perceiving",desc:"偏好灵活性和开放性"}
};

// ===== Questions (20 questions, 5 per dimension) =====
var QUESTIONS = [
  // E/I (5题)
  {text:"参加聚会时，你更倾向于？",dim:"EI",a:"主动和更多人聊天，认识新朋友",pA:"E",b:"和几个熟悉的人深入交流，或安静地待着",pB:"I"},
  {text:"经历一整天繁忙的社交后，你通常会？",dim:"EI",a:"感到精力充沛，还想继续",pA:"E",b:"觉得需要独处来恢复能量",pB:"I"},
  {text:"在一个新环境中，你通常会？",dim:"EI",a:"很快融入，主动了解周围",pA:"E",b:"先观察一段时间，再慢慢适应",pB:"I"},
  {text:"遇到问题时，你更倾向于？",dim:"EI",a:"和别人讨论，边说边想",pA:"E",b:"自己先想清楚，再和别人说",pB:"I"},
  {text:"周末独处太久时，你通常会觉得？",dim:"EI",a:"想出去找朋友或参加活动",pA:"E",b:"很享受，不太想被打扰",pB:"I"},

  // S/N (5题)
  {text:"你更喜欢的描述方式是？",dim:"SN",a:"具体、详细、有实际例证",pA:"S",b:"概括、抽象、有想象空间",pB:"N"},
  {text:"学习一个新事物时，你更关注？",dim:"SN",a:"它的实际用途和操作步骤",pA:"S",b:"它背后的原理和未来可能",pB:"N"},
  {text:"你更信赖的判断依据是？",dim:"SN",a:"已有的事实和经验",pA:"S",b:"直觉和灵感",pB:"N"},
  {text:"读一本书时，你更在意？",dim:"SN",a:"书中的具体情节和细节描写",pA:"S",b:"书传递的深层含义和隐喻",pB:"N"},
  {text:"你更欣赏哪种想法？",dim:"SN",a:"脚踏实地、有据可依的方案",pA:"S",b:"天马行空、充满创意的构想",pB:"N"},

  // T/F (5题)
  {text:"朋友遇到困难向你倾诉时，你通常会？",dim:"TF",a:"帮对方分析问题，提出解决方案",pA:"T",b:"先安慰对方情绪，给予情感支持",pB:"F"},
  {text:"做一个决定时，你更看重？",dim:"TF",a:"逻辑是否通顺，是否客观合理",pA:"T",b:"是否照顾到每个人的感受",pB:"F"},
  {text:"评价一件事时，你更倾向于？",dim:"TF",a:"就事论事，对错分明",pA:"T",b:"考虑情境和人情，留有余地",pB:"F"},
  {text:"你认为更重要的品质是？",dim:"TF",a:"公正、诚实、能力",pA:"T",b:"同理心、善良、包容",pB:"F"},
  {text:"和人发生分歧时，你通常会？",dim:"TF",a:"用事实和论据说服对方",pA:"T",b:"试图理解对方的立场和感受",pB:"F"},

  // J/P (5题)
  {text:"面对一个待办事项，你更倾向于？",dim:"JP",a:"提前列好计划，按部就班完成",pA:"J",b:"边做边想，视情况灵活调整",pB:"P"},
  {text:"出门旅行时，你更偏好？",dim:"JP",a:"详细规划行程和住宿",pA:"J",b:"定个大方向，到了再说",pB:"P"},
  {text:"你更享受的工作方式是？",dim:"JP",a:"有明确的截止日期和流程",pA:"J",b:"自由安排，灵活弹性",pB:"P"},
  {text:"你的生活空间通常是？",dim:"JP",a:"整洁有序，物品各有其位",pA:"J",b:"比较随意，用到哪放到哪",pB:"P"},
  {text:"面对截止日期，你通常？",dim:"JP",a:"提前完成，不喜欢最后赶工",pA:"J",b:"在最后期限前效率最高",pB:"P"}
];

// ===== State =====
var currentQ = 0;
var answers = new Array(QUESTIONS.length).fill(null);

// ===== Functions =====
function startQuiz(){
  currentQ = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  document.getElementById('welcomePage').style.display='none';
  document.getElementById('resultPage').style.display='none';
  document.getElementById('quizPage').style.display='flex';
  document.getElementById('quizPage').classList.add('fade-in');
  showQuestion();
}

function showQuestion(){
  var q = QUESTIONS[currentQ];
  var total = QUESTIONS.length;
  document.getElementById('qCounter').textContent = '第 '+(currentQ+1)+'/'+total+' 题';
  var pct = Math.round((currentQ/total)*100);
  document.getElementById('qPct').textContent = pct+'%';
  document.getElementById('progressFill').style.width = pct+'%';

  var qText = document.getElementById('qText');
  qText.textContent = q.text;
  qText.classList.remove('slide-in'); void qText.offsetWidth; qText.classList.add('slide-in');

  var container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  container.classList.remove('slide-in'); void container.offsetWidth; container.classList.add('slide-in');

  var btnA = document.createElement('button');
  btnA.className = 'option-btn';
  if(answers[currentQ]==='A') btnA.classList.add('selected');
  btnA.innerHTML = '<span class="option-label">A</span><span>'+q.a+'</span>';
  btnA.onclick = function(){ selectOption('A'); };

  var btnB = document.createElement('button');
  btnB.className = 'option-btn';
  if(answers[currentQ]==='B') btnB.classList.add('selected');
  btnB.innerHTML = '<span class="option-label">B</span><span>'+q.b+'</span>';
  btnB.onclick = function(){ selectOption('B'); };

  container.appendChild(btnA);
  container.appendChild(btnB);
  updateNavButtons();
}

function selectOption(opt){
  answers[currentQ] = opt;
  var buttons = document.querySelectorAll('#optionsContainer .option-btn');
  buttons.forEach(function(b){ b.classList.remove('selected'); });
  if(opt==='A') buttons[0].classList.add('selected');
  else buttons[1].classList.add('selected');
  updateNavButtons();
}

function updateNavButtons(){
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  prevBtn.disabled = (currentQ===0);
  if(currentQ===QUESTIONS.length-1){
    nextBtn.textContent = '查看结果';
  } else {
    nextBtn.textContent = '下一题';
  }
  nextBtn.disabled = (answers[currentQ]===null);
}

function goPrev(){
  if(currentQ>0){
    currentQ--;
    showQuestion();
  }
}

function goNext(){
  if(answers[currentQ]===null) return;
  if(currentQ<QUESTIONS.length-1){
    currentQ++;
    showQuestion();
  } else {
    var unanswered = 0;
    for(var i=0;i<answers.length;i++){
      if(answers[i]===null) unanswered++;
    }
    if(unanswered>0){
      document.getElementById('modalText').textContent = '您还有 '+unanswered+' 道题尚未作答，请完成所有题目后再查看结果。';
      document.getElementById('modalOverlay').classList.add('show');
      return;
    }
    showResult();
  }
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
}

function calcResult(){
  var scores = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  for(var i=0;i<answers.length;i++){
    var q = QUESTIONS[i];
    if(answers[i]==='A') scores[q.pA]++;
    else scores[q.pB]++;
  }
  var dims = [
    {key:'EI',order:['E','I']},
    {key:'SN',order:['S','N']},
    {key:'TF',order:['T','F']},
    {key:'JP',order:['J','P']}
  ];
  var typeCode = '';
  var dimResults = [];
  dims.forEach(function(d){
    var aCount = scores[d.order[0]];
    var bCount = scores[d.order[1]];
    var total = aCount + bCount;
    var dominant;
    if(aCount > bCount) dominant = d.order[0];
    else if(bCount > aCount) dominant = d.order[1];
    else dominant = d.order[0];
    typeCode += dominant;
    dimResults.push({
      key:d.key,
      leftPct:Math.round((aCount/total)*100),
      rightPct:Math.round((bCount/total)*100),
      dominant:dominant
    });
  });
  return {typeCode:typeCode, dimResults:dimResults};
}

function showResult(){
  document.getElementById('quizPage').style.display='none';
  document.getElementById('resultPage').style.display='flex';
  document.getElementById('resultPage').classList.add('fade-in');

  var r = calcResult();
  var info = TYPE_DATA[r.typeCode];

  document.getElementById('resultType').textContent = r.typeCode;
  document.getElementById('resultNickname').textContent = info.n;
  document.getElementById('resultTraits').textContent = info.t;

  // Dimension chart
  var chart = document.getElementById('dimChart');
  chart.innerHTML = '';
  r.dimResults.forEach(function(dr){
    var di = DIM_INFO[dr.key];
    var leftDom = dr.dominant === di.l;
    var row = document.createElement('div');
    row.className = 'dim-row';
    row.innerHTML =
      '<div class="dim-labels">' +
        '<span class="l">'+di.lLabel+' '+dr.leftPct+'%</span>' +
        '<span class="r">'+di.rLabel+' '+dr.rightPct+'%</span>' +
      '</div>' +
      '<div class="dim-bar">' +
        '<div class="bar-l'+(leftDom?'':' sec')+'" style="width:'+dr.leftPct+'%"></div>' +
        '<div class="bar-r'+(leftDom?' sec':'')+'" style="width:'+dr.rightPct+'%"></div>' +
      '</div>';
    chart.appendChild(row);
  });

  // Four letter meanings
  var lettersDiv = document.getElementById('dimLetters');
  lettersDiv.innerHTML = '';
  var letters = r.typeCode.split('');
  letters.forEach(function(letter){
    var li = DIM_LETTER_INFO[letter];
    var row = document.createElement('div');
    row.className = 'dim-letter-row';
    row.innerHTML =
      '<div class="dim-letter-badge">'+letter+'</div>' +
      '<div class="dim-letter-text"><strong>'+li.name+'</strong> — '+li.desc+'</div>';
    lettersDiv.appendChild(row);
  });
}

function restart(){
  currentQ = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  document.getElementById('resultPage').style.display='none';
  document.getElementById('welcomePage').style.display='flex';
  document.getElementById('welcomePage').classList.add('fade-in');
}

// ===== Export PNG =====
function exportResult(){
  var r = calcResult();
  var info = TYPE_DATA[r.typeCode];
  var canvas = document.createElement('canvas');
  var w=600, h=560;
  var dpr = window.devicePixelRatio || 1;
  canvas.width = w*dpr; canvas.height = h*dpr;
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  // BG
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0,0,w,h);
  // Top bar
  ctx.fillStyle = '#4A90D9'; ctx.fillRect(0,0,w,6);
  // Title
  ctx.fillStyle = '#BDC3C7';
  ctx.font = '14px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('MBTI \u6027\u683C\u6D4B\u8BC4\u7ED3\u679C', w/2, 40);
  // Type code
  ctx.fillStyle = '#4A90D9';
  ctx.font = 'bold 52px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillText(r.typeCode, w/2, 100);
  // Nickname
  ctx.fillStyle = '#2C3E50';
  ctx.font = 'bold 20px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillText(info.n, w/2, 130);
  // Traits
  ctx.fillStyle = '#7F8C8D';
  ctx.font = '14px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  wrapText(ctx, info.t, w/2, 160, w-80, 22);
  // Divider
  ctx.strokeStyle = '#E8ECF0';
  ctx.beginPath(); ctx.moveTo(60,200); ctx.lineTo(w-60,200); ctx.stroke();
  // Bars
  var y = 230;
  var di2 = {
    EI:{l:'E \u5916\u5411',r:'I \u5185\u5411'},
    SN:{l:'S \u5B9E\u611F',r:'N \u76F4\u89C9'},
    TF:{l:'T \u601D\u8003',r:'F \u60C5\u611F'},
    JP:{l:'J \u5224\u65AD',r:'P \u611F\u77E5'}
  };
  r.dimResults.forEach(function(dr){
    var info2 = di2[dr.key];
    ctx.fillStyle = '#2C3E50';
    ctx.font = 'bold 13px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(info2.l+'  '+dr.leftPct+'%', 60, y);
    ctx.fillStyle = '#7F8C8D';
    ctx.textAlign = 'right';
    ctx.fillText(info2.r+'  '+dr.rightPct+'%', w-60, y);
    y += 8;
    ctx.fillStyle = '#E8ECF0';
    ctx.fillRect(60, y, w-120, 16);
    var barW = w-120;
    var leftW = Math.round(barW * dr.leftPct / 100);
    var leftDom = dr.dominant === dr.key[0];
    ctx.fillStyle = leftDom ? '#4A90D9' : '#BDC3C7';
    ctx.fillRect(60, y, leftW, 16);
    ctx.fillStyle = leftDom ? '#BDC3C7' : '#4A90D9';
    ctx.fillRect(60+leftW, y, barW-leftW, 16);
    y += 34;
  });
  // Four letter meanings
  var letters = r.typeCode.split('');
  var li2 = {
    E:'\u5916\u5411', I:'\u5185\u5411', S:'\u5B9E\u611F', N:'\u76F4\u89C9',
    T:'\u601D\u8003', F:'\u60C5\u611F', J:'\u5224\u65AD', P:'\u611F\u77E5'
  };
  var letterStr = letters.map(function(l){ return l+' '+li2[l]; }).join('  \u00B7  ');
  ctx.fillStyle = '#7F8C8D';
  ctx.font = '13px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(letterStr, w/2, y+10);
  // Disclaimer
  ctx.fillStyle = '#BDC3C7';
  ctx.font = '11px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  wrapText(ctx, '\u672C\u6D4B\u8BC4\u4EC5\u4F9B\u5A71\u4E50\u548C\u81EA\u6211\u4E86\u89E3\uFF0C\u4E0D\u6784\u6210\u5FC3\u7406\u8BCA\u65AD\u6216\u4E13\u4E1A\u5EFA\u8BAE\u3002', w/2, h-30, w-80, 16);

  var link = document.createElement('a');
  link.download = 'MBTI\u6D4B\u8BC4\u7ED3\u679C-'+r.typeCode+'.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function wrapText(ctx, text, x, y, maxW, lh){
  var chars = text.split('');
  var line = ''; var curY = y;
  for(var i=0;i<chars.length;i++){
    var testLine = line + chars[i];
    if(ctx.measureText(testLine).width > maxW && line.length > 0){
      ctx.fillText(line, x, curY);
      line = chars[i]; curY += lh;
    } else { line = testLine; }
  }
  if(line.length > 0) ctx.fillText(line, x, curY);
}
